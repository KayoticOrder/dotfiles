[cursor]
style = "Block"
vi_mode_style = "Block"

[env]
TERM = "xterm-256color"

[font]
size = 14

[font.glyph_offset]
y = 0

[font.normal]
family = "Iosevka Nerd Font"
style = "Regular"

[font.bold]
family = "Iosevka Term"
style = "Bold"

[font.offset]
y = 0

[scrolling]
history = 1000
multiplier = 3

[window.padding]
x = 24
y = 24

[general]
import = ["~/.config/alacritty/themes/themes/kanagawa_wave.toml"]

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"
