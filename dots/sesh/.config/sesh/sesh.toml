# sesh only applies `windows` to [[session]]/[[wildcard]] entries, not to
# [default_session], so the layout hangs off the wildcard (repos two levels
# under $HOME, e.g. ~/code/foo); anything else just gets the AI window.
[default_session]
startup_command = "claude"

[[wildcard]]
pattern = "~/*/*"
startup_command = "claude"
windows = ["nvim", "shell"]

[[window]]
name = "nvim"
startup_script = "nvim"

[[window]]
name = "shell"
