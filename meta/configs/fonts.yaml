# Downloaded directly from upstream, no package manager involved - works
# identically on every distro. Two separate families are needed:
#   - "Iosevka Nerd Font" (icon glyphs) - alacritty's font.normal
#     from ryanoasis/nerd-fonts, which patches Iosevka to add the icons.
#   - "Iosevka Term" - alacritty's font.bold and kitty's font_family
#     from be5invis/Iosevka's own release (the *upstream* project); this
#     zip also contains the base "Iosevka" and "Iosevka Fixed" families.
# Both are pinned to a specific version rather than "latest" so a fresh
# install is reproducible. Bump these by hand when you want an update.
- shell:
  - command: |
      mkdir -p ~/.local/share/fonts/NerdFonts ~/.local/share/fonts/Iosevka
      rc=0

      if [ ! -f ~/.local/share/fonts/NerdFonts/IosevkaNerdFont-Regular.ttf ]; then
        curl --retry 3 --retry-delay 2 -fLo /tmp/iosevka-nerd.zip https://github.com/ryanoasis/nerd-fonts/releases/download/v3.4.0/Iosevka.zip
        python3 -m zipfile -e /tmp/iosevka-nerd.zip ~/.local/share/fonts/NerdFonts
        rm -f /tmp/iosevka-nerd.zip
        if [ ! -f ~/.local/share/fonts/NerdFonts/IosevkaNerdFont-Regular.ttf ]; then
          echo "ERROR: Iosevka Nerd Font install failed - IosevkaNerdFont-Regular.ttf missing after extraction" >&2
          rc=1
        fi
      fi

      if [ ! -f ~/.local/share/fonts/Iosevka/Iosevka-Regular.ttc ]; then
        curl --retry 3 --retry-delay 2 -fLo /tmp/iosevka.zip https://github.com/be5invis/Iosevka/releases/download/v34.8.0/PkgTTC-Iosevka-34.8.0.zip
        python3 -m zipfile -e /tmp/iosevka.zip ~/.local/share/fonts/Iosevka
        rm -f /tmp/iosevka.zip
        if [ ! -f ~/.local/share/fonts/Iosevka/Iosevka-Regular.ttc ]; then
          echo "ERROR: Iosevka Term install failed - Iosevka-Regular.ttc missing after extraction" >&2
          rc=1
        fi
      fi

      # Explicit directory args, not a bare `fc-cache -f`: that relies on
      # these dirs being in fontconfig's *configured* search path (e.g. via
      # a ~/.config/fontconfig/fonts.conf or distro default), which proved
      # unreliable - passing the dirs directly registers and caches them
      # regardless of what's configured.
      fc-cache -f ~/.local/share/fonts/NerdFonts ~/.local/share/fonts/Iosevka

      # Belt-and-suspenders: confirm fontconfig can actually see these fonts,
      # not just that the files landed on disk. No -q on the grep here: with
      # pipefail active elsewhere in this repo's scripts, grep -q exiting
      # early on a match can SIGPIPE fc-list mid-write and get misreported
      # as a failure even though the match was found - a real bug this
      # config hit once already (see tests/verify.sh's check_font).
      if ! fc-list | grep -i "iosevka.*nerd" >/dev/null; then
        echo "ERROR: fc-list can't see Iosevka Nerd Font even though the file exists" >&2
        rc=1
      fi
      if ! fc-list | grep -i "iosevka term" >/dev/null; then
        echo "ERROR: fc-list can't see Iosevka Term even though the file exists" >&2
        rc=1
      fi

      exit $rc
    description: "Download Iosevka Nerd Font + Iosevka Term directly from upstream"
