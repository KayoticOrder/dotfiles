# Autologin on tty1 straight into Hyprland, so a Wake-on-LAN boot is streamable
# without anyone at the keyboard. Anyone with physical access gets your desktop.
- shell:
  - command: |
      sudo mkdir -p /etc/systemd/system/getty@tty1.service.d
      sudo tee /etc/systemd/system/getty@tty1.service.d/autologin.conf >/dev/null <<EOF
      [Service]
      ExecStart=
      ExecStart=-/sbin/agetty --autologin $USER --noclear %I linux
      EOF
    description: "Autologin on tty1"
  - command: |
      line='[ "$(tty)" = /dev/tty1 ] && [ -z "$WAYLAND_DISPLAY" ] && exec start-hyprland'
      grep -qxF "$line" ~/.zprofile 2>/dev/null || echo "$line" >> ~/.zprofile
    description: "Start Hyprland on tty1 login"
